version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stormsale-backend-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-stormsale}:${POSTGRES_PASSWORD:-stormsale_secure_pass}@db:5432/${POSTGRES_DB:-stormsale_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - STELLAR_NETWORK=${STELLAR_NETWORK:-testnet}
      - HORIZON_URL=${HORIZON_URL:-https://horizon-testnet.stellar.org}
      - SOROBAN_RPC_URL=${SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stormsale-network

  db:
    image: postgres:16-alpine
    container_name: stormsale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stormsale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stormsale_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-stormsale_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stormsale} -d ${POSTGRES_DB:-stormsale_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stormsale-network

  redis:
    image: redis:7-alpine
    container_name: stormsale-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stormsale-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  stormsale-network:
    driver: bridge

